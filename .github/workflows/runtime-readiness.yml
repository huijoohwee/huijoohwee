name: Runtime Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Runtime Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run runtime:check
      - run: npm run build
      - run: npm run runtime:check
