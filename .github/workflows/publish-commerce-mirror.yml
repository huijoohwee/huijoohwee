name: Publish Commerce Content Mirror

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current protected agentic-commerce-os main revision
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: commerce-content-mirror-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Commerce content PR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      COMMERCE_SOURCE_SHA: ${{ inputs.source_sha }}
      COMMERCE_SOURCE_ROOT: ${{ github.workspace }}/commerce-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-commerce-os
          ref: ${{ inputs.source_sha }}
          path: commerce-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Validate owner, source and mirror main revisions
        run: |
          set -euo pipefail
          printf '\n/commerce-source/\n' >> .git/info/exclude
          test "$GITHUB_ACTOR" = huijoohwee
          [[ "$COMMERCE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          root_status=$(git status --porcelain --untracked-files=all \
            | sed -e '/^?? commerce-source\//d' \
              -e '/^.. content\/agentic-commerce-os\//d' \
              -e '/^.. \.agentic-os\/owner-projections\.json$/d')
          test -z "$root_status"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$(git -C commerce-source rev-parse HEAD)" = "$COMMERCE_SOURCE_SHA"
          test -z "$(git -C commerce-source status --porcelain --untracked-files=all)"
          test "$(git -C commerce-source ls-remote origin refs/heads/main | cut -f1)" = "$COMMERCE_SOURCE_SHA"
      - name: Run root lifecycle and mirror checks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run check:source
      - name: Run exact Commerce source checks
        working-directory: commerce-source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:adlc
          npm run check:evidence-contract
          node_modules/.bin/playwright install chromium
          npm run check:local-first
      - name: Generate and verify the Commerce content mirror
        run: |
          set -euo pipefail
          node scripts/commerce-mirror-artifact.mjs publish
          npm run commerce:mirror:check
          npm run runtime:check
          test -z "$(git status --porcelain --untracked-files=all \
            | sed -e '/^.. content\/agentic-commerce-os\//d' \
              -e '/^.. \.agentic-os\/owner-projections\.json$/d')"
      - name: Open a protected mirror pull request and require its gate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          branch="commerce-mirror-$SOURCE_SHA"
          git add -- content/agentic-commerce-os .agentic-os/owner-projections.json
          git diff --cached --name-only | grep -qx content/agentic-commerce-os/commerce-content-mirror.json
          test -z "$(git diff --cached --name-only | grep -v -E '^(content/agentic-commerce-os/|\.agentic-os/owner-projections\.json$)')"
          expected_tree=$(git write-tree)
          remote_oid=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if test -n "$remote_oid"; then
            git fetch --no-tags origin "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_oid"
            parent_line=$(git rev-list --parents -n 1 "$remote_oid")
            test "$(wc -w <<< "$parent_line" | tr -d ' ')" = 2
            base_oid=$(git rev-parse "$remote_oid^1")
            git merge-base --is-ancestor "$base_oid" origin/main
            git diff --quiet "$base_oid" "$remote_oid" -- . \
              ':(exclude)content/agentic-commerce-os' ':(exclude).agentic-os/owner-projections.json'
            git diff --quiet "$remote_oid" "$expected_tree" -- content/agentic-commerce-os .agentic-os/owner-projections.json
            git switch --detach "$remote_oid"
          else
            git switch -c "$branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish Commerce content mirror for ${SOURCE_SHA:0:12}"
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr_url=$(gh pr list --base main --head "$branch" --state open --json url,headRefOid --jq 'if length > 1 then error("Multiple mirror PRs for one publisher branch") elif length == 1 then .[0].url else empty end')
          if test -z "$pr_url"; then
            {
              printf '## Commerce content mirror\n\nGenerated from protected Commerce main at `%s`.\n\n' "$SOURCE_SHA"
              printf 'The mirror manifest binds the source tree and every mirrored file hash. `.agentic-os/owner-projections.json` records exact owner bytes for offline reuse checks. This PR updates only those two generated paths; it does not deploy or change a Cloudflare route. Commerce’s existing Local-first Production Release remains the Worker release and rollback owner.\n'
            } > "$RUNNER_TEMP/commerce-mirror-pr.md"
            pr_url=$(gh pr create --base main --head "$branch" --title "Publish Commerce content mirror ${SOURCE_SHA:0:12}" --body-file "$RUNNER_TEMP/commerce-mirror-pr.md")
          else
            pr_head=$(gh pr view "$pr_url" --json headRefOid --jq .headRefOid)
            test "$pr_head" = "$(git rev-parse HEAD)"
          fi
          gh workflow run runtime-readiness.yml --ref "$branch"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow runtime-readiness.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            test -n "$run_id" && break
            sleep 10
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
          head_sha=$(git rev-parse HEAD)
          SOURCE_SHA="$head_sha" gh run view "$run_id" --json headSha,conclusion,jobs --jq '
            if .headSha != env.SOURCE_SHA or .conclusion != "success" or ([.jobs[] | select(.name == "Runtime Readiness Gate" and .conclusion == "success")] | length) != 1 then error("Exact Runtime Readiness Gate evidence missing") else . end'
          gh pr checks "$pr_url" --required
          echo "Commerce mirror PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
